<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judetopia</title>
  <meta name="description" content="A corner of the internet for community, curiosity & cats." />
  <link rel="icon" href="assets/img/doodle-eye-spiral.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@300;400&family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    body {
      background:
        radial-gradient(ellipse 55% 50% at 50% 36%, rgba(74, 31, 154, .2), transparent 70%),
        radial-gradient(ellipse 120% 95% at 50% 40%, var(--desk) 25%, #0b0610 100%);
    }

    .stage {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3vh 16px 6vh;
      text-align: center;
    }

    /* A shape in the dark. Only the eye is lit; the rest shows where the light falls. */
    .presence {
      --x: 53%;
      --y: 34%;
      --r: clamp(120px, 24vmin, 250px);
      position: relative;
      width: min(calc(60svh * .866), 100%, 500px);
      aspect-ratio: 800 / 924;
      animation: surface 2.6s ease both;
    }
    /* the haze spills 30% past the figure on every side, so its centre is remapped onto the larger box */
    .presence::before {
      content: '';
      position: absolute;
      inset: -30%;
      background: radial-gradient(circle var(--r) at calc(18.75% + var(--x) * .625) calc(18.75% + var(--y) * .625), rgba(200, 183, 218, .09), transparent);
      pointer-events: none;
    }
    .shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .85;
      /* the light, intersected with a soft vignette so the scan's edges never show */
      -webkit-mask-image:
        radial-gradient(circle var(--r) at var(--x) var(--y), #000, rgba(0, 0, 0, .4) 45%, rgba(0, 0, 0, .03)),
        radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        radial-gradient(circle var(--r) at var(--x) var(--y), #000, rgba(0, 0, 0, .4) 45%, rgba(0, 0, 0, .03)),
        radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
      mask-composite: intersect;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* sits exactly over the eye drawn in the figure's chest */
    .eye {
      position: absolute;
      left: 53.2%;
      top: 33.5%;
      width: 44%;
      translate: -51% -52%;
      filter: drop-shadow(0 0 22px rgba(224, 37, 143, .35));
      animation: blink 7s 3s infinite;
      user-select: none;
      -webkit-user-drag: none;
    }

    .words {
      position: relative;
      z-index: 2;
      margin-top: clamp(-80px, -7vh, -24px);
    }
    .name {
      font-family: var(--f-thin);
      font-weight: 300;
      font-size: clamp(1.3rem, 3.4vw, 1.9rem);
      letter-spacing: .55em;
      margin-right: -.55em;
      text-transform: uppercase;
      color: var(--on-desk);
      text-shadow: 0 0 24px rgba(11, 6, 16, .9);
    }
    .whisper {
      margin: .7rem 0 1.9rem;
      font-style: italic;
      color: var(--on-desk-soft);
    }
    .whisper span {
      display: inline-block;
      width: 15ch;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: bottom;
      border-right: .08em solid currentColor;
      animation: type 1.8s steps(14) 1.4s both, caret 1.1s step-end 3.2s infinite;
    }
    @keyframes type { from { width: 0; } }
    @keyframes caret { 50% { border-color: transparent; } }
    @keyframes surface { from { opacity: 0; filter: blur(6px); } }

    .words .site-nav { justify-content: center; }
    .words .tape { filter: saturate(.4) brightness(.78); transition: filter .35s, transform .2s; }
    .words .tape:hover, .words .tape:focus-visible { filter: none; }
  </style>
</head>
<body>

<main class="stage">
  <div class="presence" aria-hidden="true">
    <img class="shape" src="assets/img/doodle-figure.webp" alt="" width="800" height="924" />
    <img class="eye" src="assets/img/doodle-eye-spiral.webp" alt="" width="700" height="934" />
  </div>

  <div class="words">
    <h1 class="name">Judetopia</h1>
    <p class="whisper"><span>are you there?</span></p>
    <nav aria-label="Main">
      <ul class="site-nav">
        <li><a class="tape" href="zines.html">Joodlebug Ink</a></li>
        <li><a class="tape" href="tuba.html">Tuba's Corner</a></li>
        <li><a class="tape" href="bug.html">Featured Bug</a></li>
      </ul>
    </nav>
  </div>
</main>

<script>
  // The light follows the pointer; left alone, it wanders over the figure. The eye watches it.
  const presence = document.querySelector('.presence');
  const eye = presence.querySelector('.eye');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const home = { x: .532, y: .335 };
  let target = { ...home };
  let light = { ...home };
  let lastMove = -Infinity;

  addEventListener('pointermove', e => {
    const r = presence.getBoundingClientRect();
    target = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
    lastMove = performance.now();
  }, { passive: true });

  const frame = t => {
    if (t - lastMove > 2600) {
      target = { x: .52 + .3 * Math.sin(t / 3400), y: .46 + .34 * Math.sin(t / 4700 - .33) };
    }
    light.x += (target.x - light.x) * .07;
    light.y += (target.y - light.y) * .07;
    presence.style.setProperty('--x', (light.x * 100).toFixed(2) + '%');
    presence.style.setProperty('--y', (light.y * 100).toFixed(2) + '%');
    const dx = Math.max(-1, Math.min(1, (light.x - home.x) * 2.2));
    const dy = Math.max(-1, Math.min(1, (light.y - home.y) * 2.2));
    eye.style.transform = `translate(${(dx * 9).toFixed(1)}px, ${(dy * 6).toFixed(1)}px) rotate(${(dx * 5).toFixed(1)}deg)`;
    requestAnimationFrame(frame);
  };
  if (!still.matches) requestAnimationFrame(frame);
</script>
</body>
</html>
