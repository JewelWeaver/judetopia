<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judetopia</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comfortaa:wght@700&family=Baloo+2:wght@400;500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --lavender:#BDA7D1; --lav-deep:#9B82B8; --lav-light:#EDE6F5; --lav-pale:#F7F3FC;
      --sage:#74BF92; --sage-deep:#4EA070; --sage-light:#C5E8D2; --sage-pale:#F0FAF4;
      --navy:#00127A; --periwinkle:#4E5AE4; --ice:#D9E3E8; --white:#FEFEFE;
      --text-dark:#1A1035; --text-mid:#5A4E6E; --text-soft:#8B7FA0;
      --font-logo:'Pacifico',cursive; --font-hero:'Comfortaa',cursive;
      --font-head:'Baloo 2',sans-serif; --font-body:'Nunito',sans-serif;
      --radius:20px; --radius-sm:12px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-body);background:var(--white);color:var(--text-dark);overflow-x:hidden;cursor:none;display:flex;flex-direction:column;min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    /* cursor */
    .cursor{width:18px;height:18px;background:var(--lavender);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .15s,height .15s,background .2s;mix-blend-mode:multiply;}
    .cursor.big{width:36px;height:36px;background:var(--sage);}
    /* nav */
    nav.topnav{position:sticky;top:0;z-index:100;background:rgba(247,243,252,0.96);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1.5rem;border-bottom:4px solid var(--navy);flex-wrap:nowrap;gap:1rem;}
    .topnav .nav-logo{font-family:var(--font-hero);font-size:1.85rem;color:var(--sage);white-space:nowrap;font-weight:700;-webkit-text-stroke:1.5px var(--sage);}
    .topnav .nav-links{display:flex;gap:0.1rem;list-style:none;flex-wrap:nowrap;}
    .topnav .nav-links a{font-family:var(--font-body);font-weight:700;font-size:0.76rem;color:var(--text-mid);padding:0.35rem 0.6rem;border-radius:999px;transition:background .2s,color .2s;white-space:nowrap;}
    .topnav .nav-links a:hover,.topnav .nav-links a.active{background:var(--lavender);color:var(--white);}
    .topnav .nav-links a.art{background:transparent;color:var(--text-mid);}
    .topnav .nav-links a.art:hover,.topnav .nav-links a.art.active{background:var(--lavender);color:var(--white);}
    /* footer */
    footer{background:linear-gradient(145deg,#1a0a3d,#00127A);padding:1.25rem 2rem;text-align:center;border-top:3px solid var(--lavender);}
    .foot-logo{font-family:var(--font-logo);font-size:2.2rem;color:var(--lavender);margin-bottom:.4rem;}
    .foot-sub{font-size:.85rem;color:rgba(237,230,245,.4);margin-bottom:1.5rem;font-weight:500;}
    .foot-nav{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
    .foot-nav a{font-size:.78rem;font-weight:700;color:rgba(237,230,245,.5);padding:.3rem .8rem;border-radius:999px;transition:background .2s,color .2s;}
    .foot-nav a:hover{background:rgba(189,167,209,.2);color:var(--lavender);}
    .foot-copy{font-size:.72rem;color:rgba(255,255,255,.18);font-weight:500;}
    /* shared layout */
    .page-section{padding:5rem 2rem;}
    .container{max-width:1100px;margin:0 auto;}
    .sec-label{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sage-deep);background:var(--sage-light);padding:.25rem .85rem;border-radius:999px;margin-bottom:.9rem;}
    .sec-label.lav{background:var(--lav-light);color:var(--lav-deep);}
    .sec-label.ghost{background:rgba(116,191,146,.2);color:var(--sage-light);}
    .sec-title{font-family:var(--font-head);font-weight:800;font-size:clamp(2rem,4vw,3rem);line-height:1.1;margin-bottom:.75rem;}
    .sec-intro{font-size:1rem;line-height:1.75;color:var(--text-mid);max-width:560px;margin-bottom:3rem;font-weight:500;}
    .page-header{padding:4rem 2rem 3rem;background:var(--lav-pale);border-bottom:2px solid var(--lav-light);}
    /* animations */
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes blobdrift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.05)}66%{transform:translate(-20px,15px) scale(.97)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:.2}}
    @media(max-width:700px){
      nav{padding:.6rem .75rem;}
      .nav-links{gap:0;}
      .nav-links a{font-size:.68rem;padding:.28rem .42rem;}
      .page-section{padding:3.5rem 1rem;}
      .full-label{display:none;}
      .short-label{display:inline;}
      .topnav .nav-logo{font-size:1.45rem;}
    }
    @media(min-width:701px){
      .short-label{display:none;}
      .full-label{display:inline;}
    }
  </style>
  <style>
    .hero{flex:1;display:grid;place-items:center;text-align:center;padding:1rem;position:relative;overflow:hidden;background:var(--lav-pale);max-height:72vh;}
    .blob{position:absolute;border-radius:50%;filter:blur(75px);pointer-events:none;}
    .blob1{width:620px;height:520px;background:radial-gradient(circle,rgba(189,167,209,.45) 0%,transparent 70%);top:-120px;left:-120px;animation:blobdrift 9s ease-in-out infinite;}
    .blob2{width:500px;height:480px;background:radial-gradient(circle,rgba(116,191,146,.35) 0%,transparent 70%);bottom:-80px;right:-80px;animation:blobdrift 11s 2s ease-in-out infinite reverse;}
    .blob3{width:360px;height:360px;background:radial-gradient(circle,rgba(78,90,228,.12) 0%,transparent 70%);top:42%;left:54%;animation:blobdrift 13s 1s ease-in-out infinite;}
    .hero-inner{position:relative;z-index:1;max-width:860px;}
    .hero-title{font-family:'Comfortaa',var(--font-head),sans-serif;font-size:clamp(3rem,11vw,8rem);font-weight:700;line-height:1.2;color:var(--lav-deep);margin-bottom:2.5rem;text-shadow:4px 4px 0 rgba(189,167,209,.3);animation:fadeUp .8s ease both;overflow:visible;word-break:keep-all;}
    .hero-links{display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;animation:fadeUp .8s .2s ease both;}
    .hero-link{font-family:var(--font-body);font-weight:700;font-size:0.92rem;padding:0.55rem 1.3rem;border-radius:999px;border:2px solid transparent;transition:transform .2s,box-shadow .2s;}
    .hero-link:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1);}
    .hero-link.lav{background:var(--lav-light);color:var(--lav-deep);border-color:var(--lavender);}
    .hero-link.sage{background:var(--sage-light);color:var(--sage-deep);border-color:var(--sage);}
    .hero-link.peri{background:#eaebfc;color:var(--periwinkle);border-color:var(--periwinkle);}
    .hero-link.ice{background:var(--ice);color:var(--navy);border-color:var(--ice);}
    .hero-inner { position: relative; z-index: 2; }
        .bug-hero-img{cursor:pointer;width:160px;height:160px;
      width: 120px;
      height: 120px;
      display: block;
      margin: 0 auto 1.5rem;
      animation: floatY 4s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(78,160,112,0.45));
    }
    .scroll-nudge{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);color:var(--lav-deep);font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:.4;animation:fadeUp 1s .5s ease both;}
    .scroll-nudge span{display:block;width:2px;height:30px;background:linear-gradient(to bottom,var(--lavender),transparent);border-radius:2px;animation:pulse 2s infinite;}
  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<nav class="topnav">
  <a href="index.html" class="nav-logo">Judetopia</a>
  <ul class="nav-links">
    <li><a href="blog.html">Blog</a></li>
    <li><a href="art.html" class="art">Art</a></li>
    <li><a href="tuba.html">Tuba's Corner</a></li>
    <li><a href="bug.html"><span class="full-label">Bug of the Week</span><span class="short-label">Bugs</span></a></li>
  </ul>
</nav>
<section class="hero">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

<div class="hero-inner">

                                                                                                        <a href="bug.html" aria-label="Bug of the Week"><svg class="bug-hero-img" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="shellGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a8e6c8"/>
      <stop offset="40%" stop-color="#4EA070"/>
      <stop offset="75%" stop-color="#2a7a8a"/>
      <stop offset="100%" stop-color="#1a3a6a"/>
    </radialGradient>
    <radialGradient id="sheen" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="rgba(200,255,230,0.6)"/>
      <stop offset="100%" stop-color="rgba(200,255,230,0)"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5ab89a"/>
      <stop offset="100%" stop-color="#1a4a5a"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="60" cy="108" rx="28" ry="6" fill="rgba(0,0,0,0.15)"/>
  <!-- left antennae -->
  <line x1="47" y1="30" x2="28" y2="10" stroke="#2a5a4a" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="28" cy="10" r="2" fill="#2a5a4a"/>
  <!-- right antennae -->
  <line x1="73" y1="30" x2="92" y2="10" stroke="#2a5a4a" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="92" cy="10" r="2" fill="#2a5a4a"/>
  <!-- legs left -->
  <line x1="42" y1="60" x2="20" y2="52" stroke="#1a4a3a" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="72" x2="16" y2="72" stroke="#1a4a3a" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="84" x2="20" y2="94" stroke="#1a4a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- legs right -->
  <line x1="78" y1="60" x2="100" y2="52" stroke="#1a4a3a" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="72" x2="104" y2="72" stroke="#1a4a3a" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="84" x2="100" y2="94" stroke="#1a4a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- body / elytra -->
  <ellipse cx="60" cy="72" rx="24" ry="32" fill="url(#shellGrad)"/>
  <!-- elytra center line -->
  <line x1="60" y1="42" x2="60" y2="102" stroke="rgba(20,60,50,0.4)" stroke-width="1"/>
  <!-- iridescent sheen -->
  <ellipse cx="60" cy="72" rx="24" ry="32" fill="url(#sheen)"/>
  <!-- copper highlights on wings -->
  <ellipse cx="52" cy="62" rx="8" ry="5" fill="rgba(200,120,40,0.25)" transform="rotate(-15,52,62)"/>
  <ellipse cx="68" cy="62" rx="8" ry="5" fill="rgba(200,120,40,0.25)" transform="rotate(15,68,62)"/>
  <!-- head -->
  <ellipse cx="60" cy="36" rx="15" ry="12" fill="url(#headGrad)"/>
  <!-- eyes -->
  <circle cx="52" cy="33" r="3" fill="#0a1a1a"/>
  <circle cx="68" cy="33" r="3" fill="#0a1a1a"/>
  <circle cx="51" cy="32" r="1" fill="rgba(255,255,255,0.5)"/>
  <circle cx="67" cy="32" r="1" fill="rgba(255,255,255,0.5)"/>
</svg></a>
  </div>
</section>
<footer>
  <p class="foot-copy">Made with care in Seattle. Tuba-approved.</p>
</footer>

<script>
  const cur = document.getElementById('cursor');
  document.addEventListener('mousemove', e => { cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px'; });
  document.querySelectorAll('a,button').forEach(el => {
    el.addEventListener('mouseenter', () => cur.classList.add('big'));
    el.addEventListener('mouseleave', () => cur.classList.remove('big'));
  });
</script>
</body>
</html>
