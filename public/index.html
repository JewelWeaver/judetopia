<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judetopia</title>
  <meta name="description" content="A corner of the internet for community, curiosity & cats." />
  <link rel="icon" href="assets/img/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=Bungee&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .stage {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3vh 16px 6vh;
      text-align: center;
    }

    /* A shape in the dark. Only the eye is lit; the rest shows where the light falls. */
    .presence {
      --x: 50%;
      --y: 34%;
      --r: clamp(120px, 24vmin, 250px);
      position: relative;
      width: min(calc(60svh * .866), 100%, 500px);
      aspect-ratio: 800 / 924;
      animation: surface 2.6s ease both;
    }
    /* the haze spills 30% past the figure on every side, so its centre is remapped onto the larger box */
    .presence::before {
      content: '';
      position: absolute;
      inset: -30%;
      background: radial-gradient(circle var(--r) at calc(18.75% + var(--x) * .625) calc(18.75% + var(--y) * .625), rgba(200, 183, 218, .09), transparent);
      pointer-events: none;
    }
    .shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .85;
      /* the light, intersected with a soft vignette so the scan's edges never show */
      -webkit-mask-image:
        radial-gradient(circle var(--r) at var(--x) var(--y), #000, rgba(0, 0, 0, .4) 45%, rgba(0, 0, 0, .03)),
        radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        radial-gradient(circle var(--r) at var(--x) var(--y), #000, rgba(0, 0, 0, .4) 45%, rgba(0, 0, 0, .03)),
        radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
      mask-composite: intersect;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* centered over the name (the figure's own chest eye sits a touch to the right, under it) */
    .eye {
      position: absolute;
      left: 50%;
      top: 33.5%;
      width: 46%;
      translate: -50% -50%;
      filter: drop-shadow(0 0 22px rgba(224, 37, 143, .35));
      animation: blink 7s 3s infinite;
    }
    .eye img { display: block; user-select: none; -webkit-user-drag: none; }
    .eye-base { width: 100%; height: auto; }
    /* the pupil is its own layer, centred on the drawn iris (326, 320 in the 640px art) */
    .eye-pupil {
      position: absolute;
      left: 50.94%;
      top: 50.08%;
      width: 18.75%;
      height: auto;
      translate: -50% -50%;
      will-change: transform;
    }

    .words {
      position: relative;
      z-index: 2;
      margin-top: clamp(-80px, -7vh, -24px);
    }
    .name {
      /* the same two-ink lettering as the JUDETOPIA logo */
      font-family: var(--f-logo);
      font-weight: 400;
      font-size: clamp(2.6rem, 8vw, 4.6rem);
      line-height: 1;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--on-desk);
      text-shadow: .06em .06em 0 var(--magenta), -.035em -.03em 0 var(--green);
      margin-bottom: 1.6rem;
    }
    @keyframes surface { from { opacity: 0; filter: blur(6px); } }

    .words .site-nav { justify-content: center; }
    .words .nav-link { filter: saturate(.4) brightness(.78); transition: filter .35s, transform .2s; }
    .words .nav-link:hover, .words .nav-link:focus-visible { filter: none; }
  </style>
</head>
<body data-page="home">

<main class="stage">
  <div class="presence" aria-hidden="true">
    <img class="shape" src="assets/img/doodle-figure.webp" alt="" width="800" height="924" />
    <div class="eye">
      <img class="eye-base" src="assets/img/eye-base.webp" alt="" width="640" height="639" />
      <img class="eye-pupil" src="assets/img/eye-pupil.webp" alt="" width="120" height="120" />
    </div>
  </div>

  <div class="words">
    <h1 class="name">Judetopia</h1>
    <nav aria-label="Main">
      <ul class="site-nav">
        <li><a class="nav-link" href="zines.html">Joodlebug Ink</a></li>
        <li><a class="nav-link" href="artifacts.html">Wares</a></li>
        <li><a class="nav-link" href="tuba.html">Tuba's Corner</a></li>
        <li><a class="nav-link" href="bug.html">Featured Bug</a></li>
      </ul>
    </nav>
  </div>
</main>

<script>
  // The light follows the pointer; left alone, it wanders over the figure.
  // The eye watches: its pupil darts after the cursor, holds, dilates as you get close, and twitches.
  const presence = document.querySelector('.presence');
  const eye = presence.querySelector('.eye');
  const pupil = eye.querySelector('.eye-pupil');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const home = { x: .5, y: .335 };
  let target = { ...home };
  let light = { ...home };
  let lastMove = -Infinity;
  let pointer = null;

  addEventListener('pointermove', e => {
    const r = presence.getBoundingClientRect();
    target = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
    pointer = { x: e.clientX, y: e.clientY };
    lastMove = performance.now();
  }, { passive: true });

  // pupil state: where it is, how fast it's going, where it's fixed on, how wide it is
  const gaze = { x: 0, y: 0, vx: 0, vy: 0 };
  let fix = { x: 0, y: 0 };
  let size = 1;
  let nextSaccade = 0;
  let nextTwitch = 4000;
  let twitchUntil = 0;
  let twitch = { x: 0, y: 0 };

  const watch = t => {
    const e = eye.getBoundingClientRect();
    const cx = e.left + e.width * .5094;
    const cy = e.top + e.height * .5008;
    // look at the cursor; once it's been still a while, follow the wandering light instead
    const p = pointer && t - lastMove < 2600 ? pointer : (() => {
      const r = presence.getBoundingClientRect();
      return { x: r.left + light.x * r.width, y: r.top + light.y * r.height };
    })();
    const dx = p.x - cx;
    const dy = p.y - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const reach = e.width * .05; // how far the pupil can slide inside the eye
    const pull = Math.min(1, dist / (e.width * .8));
    const want = { x: dx / dist * reach * pull, y: dy / dist * reach * pull };

    // saccades: hold a fixation, then dart once the target has wandered off or the hold runs out
    if (t > nextSaccade || Math.hypot(want.x - fix.x, want.y - fix.y) > reach * .3) {
      fix = want;
      nextSaccade = t + 140 + Math.random() * 420;
    }
    // every few seconds, a quick nervous glance somewhere else
    if (t > nextTwitch) {
      const a = Math.random() * Math.PI * 2;
      twitch = { x: Math.cos(a) * reach * .8, y: Math.sin(a) * reach * .8 };
      twitchUntil = t + 110 + Math.random() * 90;
      nextTwitch = t + 3000 + Math.random() * 6000;
    }
    const aim = t < twitchUntil ? twitch : fix;

    // a stiff spring, so it snaps and overshoots a hair
    gaze.vx = (gaze.vx + (aim.x - gaze.x) * .32) * .58;
    gaze.vy = (gaze.vy + (aim.y - gaze.y) * .32) * .58;
    gaze.x += gaze.vx;
    gaze.y += gaze.vy;

    // dilate as you come close; a constant tremor so it never quite settles
    const near = 1 - Math.min(1, dist / (e.width * 1.6));
    size += (.88 + near * .4 - size) * .06;
    const tremor = reach * .03;
    const jx = (Math.random() - .5) * tremor;
    const jy = (Math.random() - .5) * tremor;
    pupil.style.transform = `translate(${(gaze.x + jx).toFixed(2)}px, ${(gaze.y + jy).toFixed(2)}px) scale(${size.toFixed(3)})`;
  };

  const frame = t => {
    if (t - lastMove > 2600) {
      target = { x: .52 + .3 * Math.sin(t / 3400), y: .46 + .34 * Math.sin(t / 4700 - .33) };
    }
    light.x += (target.x - light.x) * .07;
    light.y += (target.y - light.y) * .07;
    presence.style.setProperty('--x', (light.x * 100).toFixed(2) + '%');
    presence.style.setProperty('--y', (light.y * 100).toFixed(2) + '%');
    const dx = Math.max(-1, Math.min(1, (light.x - home.x) * 2.2));
    const dy = Math.max(-1, Math.min(1, (light.y - home.y) * 2.2));
    eye.style.transform = `translate(${(dx * 6).toFixed(1)}px, ${(dy * 4).toFixed(1)}px) rotate(${(dx * 3).toFixed(1)}deg)`;
    watch(t);
    requestAnimationFrame(frame);
  };
  if (!still.matches) requestAnimationFrame(frame);
</script>
<script src="assets/buttons.js"></script>
</body>
</html>
