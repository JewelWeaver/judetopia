<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuba's Corner — Judetopia</title>
  <meta name="description" content="A word from Tuba, the cat in charge." />
  <link rel="icon" href="assets/img/doodle-eye-spiral.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@300;400&family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    .corner {
      width: min(860px, 100%);
      margin: 1rem auto 0;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 5vw, 3.5rem) clamp(4.5rem, 10vw, 6rem);
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      align-items: center;
      gap: 1.5rem 2.5rem;
      rotate: -.6deg;
      animation: pop-in .6s ease both;
    }
    .corner > .tape-strip:nth-of-type(1) { top: -12px; left: 10%; rotate: -5deg; }
    .corner > .tape-strip:nth-of-type(2) { top: -12px; right: 10%; rotate: 4deg; }
    .corner h1 { grid-column: 1 / -1; font-size: clamp(2.8rem, 9vw, 5.2rem); }
    .tuba { width: min(100%, 260px); margin-inline: auto; animation: bob 4s ease-in-out infinite; position: relative; z-index: 2; }

    /* thought bubble, drawn like the speech bubble on the Alien Mode cover */
    .thought { position: relative; z-index: 2; }
    .dots { position: absolute; left: -2.2rem; bottom: 1.2rem; }
    .dots span {
      position: absolute;
      border-radius: 50%;
      background: var(--butter);
      border: 3px solid var(--violet);
    }
    .dots span:nth-child(1) { width: 12px; height: 12px; left: -1.6rem; top: 1.4rem; }
    .dots span:nth-child(2) { width: 20px; height: 20px; left: -.4rem; top: 0; }
    .bubble {
      padding: 1.8rem 1.9rem 1.6rem;
      background: var(--butter);
      border: 3px solid var(--violet);
      border-radius: 58% 42% 52% 48% / 46% 56% 44% 54%;
      box-shadow: 6px 6px 0 var(--magenta);
      text-align: center;
      rotate: 2deg;
    }
    .bubble p { font-weight: 700; font-size: clamp(1rem, 2.2vw, 1.2rem); line-height: 1.45; }
    .bubble cite {
      display: block;
      margin-top: .8rem;
      font-style: normal;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--magenta);
    }

    .visitor {
      position: absolute;
      width: clamp(150px, 26vw, 230px);
      right: 6%;
      bottom: -6px;
      rotate: 178deg;
      scale: 1 -1;
      mix-blend-mode: multiply;
      animation: crawl 5s ease-in-out infinite;
      z-index: 1;
    }
    .watcher {
      position: absolute;
      width: clamp(70px, 11vw, 104px);
      top: 1.6rem;
      right: 1.6rem;
      rotate: 10deg;
      animation: blink 5s 1s infinite;
      z-index: 2;
    }

    @media (max-width: 700px) {
      .corner { grid-template-columns: 1fr; text-align: center; rotate: 0deg; }
      .dots { left: 50%; top: -1.6rem; bottom: auto; }
      .dots span:nth-child(1) { left: -.6rem; top: -1rem; }
      .dots span:nth-child(2) { left: .4rem; top: .2rem; }
      .watcher { top: auto; right: auto; bottom: 1.2rem; left: 1.2rem; }
    }
  </style>
</head>
<body>

<header class="site-head">
  <a class="logo" href="index.html" aria-label="Judetopia, home">JUDET<img src="assets/img/doodle-eye-spiral.webp" alt="" width="700" height="934" />PIA</a>
  <nav aria-label="Main">
    <ul class="site-nav">
      <li><a class="tape" href="zines.html">Zines</a></li>
      <li><a class="tape" href="tuba.html" aria-current="page"><span class="full">Tuba's Corner</span><span class="short">Tuba</span></a></li>
      <li><a class="tape" href="bug.html"><span class="full">Bug of the Week</span><span class="short">Bugs</span></a></li>
    </ul>
  </nav>
</header>

<main class="wrap">
  <section class="corner paper shadowed" style="--stock: var(--mint)">
    <span class="tape-strip"></span>
    <span class="tape-strip"></span>
    <img class="watcher" src="assets/img/doodle-eye-stitch.webp" alt="" width="700" height="553" />
    <h1 class="loud riso">Tuba's Corner</h1>
    <img class="tuba" src="assets/img/tuba.svg" alt="Tuba, a dark brown cat with gold eyes and one long fang." width="160" height="170" />
    <div class="thought">
      <div class="dots" aria-hidden="true"><span></span><span></span></div>
      <blockquote class="bubble">
        <p>&ldquo;Where were you when I laid the foundations of the earth? Tell me, if you have understanding.&rdquo;</p>
        <cite>&mdash; God to Job, Job 38:4</cite>
      </blockquote>
    </div>
    <img class="visitor" src="assets/img/doodle-gecko.webp" alt="" width="1000" height="536" />
  </section>
</main>

<footer class="site-foot">
  <img class="foot-mark" src="assets/img/brand-mark.png" alt="" width="520" height="329" />
  <p>Made with care in Seattle. Tuba-approved.</p>
  <ul class="foot-links">
    <li><a href="zines.html">Zines</a></li>
    <li><a href="tuba.html">Tuba's Corner</a></li>
    <li><a href="bug.html">Bug of the Week</a></li>
  </ul>
</footer>

</body>
</html>
